<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Non-Metal Elements</title>

    <!-- PyScript connection -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">

    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 4px;
            font-family: Arial, sans-serif;
            background: white;
        }

        .main-container {
            max-width: 535px;
            margin: auto;
            padding: 7px 18px 10px;
            background: linear-gradient(120deg, #1765ff, #5030ec);
        }

        .content {
            background: white;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
        }

        .header {
            background: #1473f9;
            color: white;
            text-align: center;
            padding: 12px;
        }

        .header h2 {
            margin: 0;
            font-size: 17px;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 10px;
        }

        .form-content {
            padding: 12px 16px;
        }

        .instructions {
            background: #d0f5fb;
            color: #17657a;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 10px;
            margin-bottom: 10px;
        }

        .instructions strong {
            display: block;
            margin-bottom: 3px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input:focus {
            border-color: #1473f9;
        }

        button {
            width: 100%;
            background: #198754;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .result-title {
            color: #1473f9;
            font-size: 12px;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        .result-box {
            background: #f5f6f7;
            border-left: 4px solid #1473f9;
            border-radius: 4px;
            padding: 10px;
            font-size: 11px;
            line-height: 16px;
            color: #333;
            min-height: 65px;
        }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 9px;
            color: #8491a0;
            background: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="content">

            <div class="header">
                <h2>Non-Metal Elements</h2>
                <p>Periodic Table Information Finder</p>
            </div>

            <div class="form-content">

                <div class="instructions">
                    <strong>Instructions:</strong>
                    Enter the <b>symbol</b> of a non-metal element
                    (Example: H, O, Cl, Ne, Xe).
                </div>

                <label for="element_input">
                    ⚲ Element Symbol
                </label>

                <input type="text" id="element_input" placeholder="Enter element symbol" maxlength="3"
                    autocomplete="off">

                <!-- CONNECTS TO PYTHON FUNCTION -->
                <button py-click="search_element">
                    Check Details
                </button>

                <hr style="border:0; border-top:1px solid #ddd; margin-top:10px;">

                <div class="result-title">
                    ▤ Result
                </div>

                <!-- PYTHON WILL DISPLAY RESULTS HERE -->
                <div class="result-box" id="result">
                    Enter an element symbol to see its details.
                </div>

            </div>

            <div class="footer">
                🟡 Skills Test • 2nd Quarter • ICT
            </div>

        </div>

    </div>

    <!-- LOAD YOUR EXISTING PYTHON FILE -->
    <script type="py" src="main.py"></script>

</body>

</html>
