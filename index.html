<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Know your non-metal elements NOW </title>

    <style>
        {
            box-sizing: border-box;
            font-family: Arial, sans-serif;

        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #253cff, #7135ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0,.2);

        }

        .header {
            background:#1268f5;
            color: white;
            text-align: center;
            padding: 15px;

        }

        .header h2 {
            margin: 0;
            font-size: 23px;

        }

        .header p {
            margin: 4px 0 0;
            font-size: 11px;

        }

        .content p {
            padding: 15px;

        }

        .content {
            padding: 15px;
        }

        .instructions {
            background: #d0f4fa;
            padding: 12px;
            border-radius: 5px;
            font-size: 12px;
            color: #24566a;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;

        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1268f5
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            background: #168c58;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #107357;
        }

        button:disabled {
            opacity: 0.0;
            cursor: wait;
        }

        .divider {
            border: none;
            border-top: 1px solid #ddd;
            margin: 12px 0;
        }

        .result-title {
            color: #1268f5;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-box {
            bakcground: #f5f6f8;
            border-left: 4px solid #1268f5;
            border-radius: 4px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.7;
            min-height: 75px;
        }

        .result-box strong {
            color: #222;
        }

        .success {
            border-left-color: #168c58;
        }

        .error {
            border-left-color: #e53935;
            color: #d32f2f;
        }

        .footer {
            text-align: center;
            background: #fafafa;
            padding: 10px;
            color: #999;
            font-size: 10px;
            border-top: 1px solid #eee;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Non-Metal Elements</h2>
            <p>Periodic Table Information Finder</p>
        </div>

    </div>

    <div class="content">

        <div class="instrictions">
            <strong>Instructions:</strong><br>
            Enter the <b>symbol</b> of a non-metal elements
            (Example: H, O, Cl, Ne, Xe)
        </div>

    </div>
</body>
</html>
